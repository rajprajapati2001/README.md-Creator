<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="shortcut icon" href="/assets/readme-icon-nobg.svg" type="image/x-icon">
  <link href="https://fonts.googleapis.com/css2?family=Anton&family=Pacifico&display=swap" rel="stylesheet">
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <title>README.md Creator</title>
  <style>
    body {
      margin: 0;
      overflow: hidden;
      background: #000;
    }

    /* Lightweight GPU-accelerated smooth floating animation */
    @keyframes float {
      0%, 100% {
        transform: translate3d(0, 0, 0) scale(1);
      }
      33% {
        transform: translate3d(35px, -50px, 0) scale(1.05);
      }
      66% {
        transform: translate3d(-30px, 30px, 0) scale(0.95);
      }
    }

    .blob {
      position: absolute;
      border-radius: 9999px;
      filter: blur(70px);
      opacity: 0.4;
      animation: float 12s ease-in-out infinite;
      will-change: transform;
    }

    .blob-1 { width: 24rem; height: 24rem; background: #3b82f6; top: 10%; left: 10%; animation-duration: 14s; }
    .blob-2 { width: 28rem; height: 28rem; background: #8b5cf6; top: 50%; right: 10%; animation-duration: 18s; animation-delay: -3s; }
    .blob-3 { width: 20rem; height: 20rem; background: #22d3ee; bottom: 10%; left: 30%; animation-duration: 16s; animation-delay: -6s; }
    .blob-4 { width: 22rem; height: 22rem; background: #4f46e5; top: 20%; right: 30%; animation-duration: 20s; animation-delay: -9s; }
    .blob-5 { width: 18rem; height: 18rem; background: #9333ea; bottom: 15%; right: 20%; animation-duration: 15s; animation-delay: -4s; }

    .logo-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 1.5rem;
    }

    .logo img {
      width: 150px;
      height: 150px;
      filter: drop-shadow(0 0 25px rgba(59, 130, 246, 0.7)) drop-shadow(0 0 50px rgba(37, 99, 235, 0.4));
    }

    .bar-logo img {
      width: 100px;
      height: 10px;
    }

    .logo path {
      fill: #fff;
    }
  </style>
</head>

<body>

  <!-- Splash Screen -->
  <div id="splash-screen" class="fixed inset-0 bg-black overflow-hidden z-50">
    <!-- Floating Background -->
    <div class="absolute inset-0 pointer-events-none">
      <div class="blob blob-1"></div>
      <div class="blob blob-2"></div>
      <div class="blob blob-3"></div>
      <div class="blob blob-4"></div>
      <div class="blob blob-5"></div>
    </div>

    <!-- Center Logo & Bar stacked vertically -->
    <div class="absolute inset-0 flex items-center justify-center z-10">
      <div class="logo-container">
        <div class="logo">
          <img src="/assets/readme-icon-nobg.svg" alt="Logo">
        </div>
        <div class="bar-logo">
          <img src="/assets/horizontal-bar.svg" alt="Horizontal Bar">
        </div>
      </div>
    </div>
  </div>

  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
